<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        h1{
            text-decoration: underline;
            text-transform: uppercase;
        }

        h2{
            text-decoration: overline;
            text-transform: lowercase;
        }

        h3{
            text-decoration: line-through;

            text-transform: capitalize;
        }

        h4{
            text-decoration: none;
            text-transform: none; 
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Text Transform - Activity 3</h1>
    <h2>Welcome to the world of CSS!</h2>
    <h3>Let's learn about text transformation</h3>
    <h4>Text transformation allows you to change the appearance of text</h4>
</body>
</html>
